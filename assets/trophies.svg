<svg
  width="360"
  height="382"
  viewBox="0 0 360 382"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="trophyShowroomTitle"
>
  <title id="trophyShowroomTitle">Mohammed Areeb Ali Shivji's Hall of Trophies &amp; Achievements - Pull Shark x2, YOLO and Quickdraw</title>
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .trophy-badge {
      font-size: 8.5px;
      font-weight: 700;
      text-anchor: middle;
      letter-spacing: 0.4px;
    }
    .trophy-title-lg {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .trophy-sub-text {
      font-size: 10.5px;
      font-weight: 500;
    }
  </style>

  <!-- Pull Shark -->
  <g>
    <rect x="6" y="6" width="348" height="118" rx="12" fill="url(#cardGrad)" stroke="#f0a56b" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(52, 65)">
      <circle r="33" fill="#f0a56b" fill-opacity="0.1" stroke="#f0a56b" stroke-width="1.5" filter="url(#neonGlow)"/>
      <circle r="26" stroke="#f0a56b" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3"/>
      <g stroke="#f0a56b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="-8" cy="-11" r="3.2"/>
        <circle cx="-8" cy="11" r="3.2"/>
        <circle cx="8" cy="11" r="3.2"/>
        <path d="M-8,-7 L-8,7"/>
        <path d="M8,7 L8,-5 Q8,-10 3,-10 L0,-10"/>
        <path d="M3,-14 L-1,-10 L3,-6"/>
      </g>
    </g>
    <g transform="translate(98, 21)">
      <rect width="124" height="16" rx="8" fill="#f0a56b" fill-opacity="0.15" stroke="#f0a56b" stroke-width="0.8"/>
      <text x="62" y="11.2" class="trophy-badge" fill="#f0a56b">OFFICIAL ACHIEVEMENT</text>
      <text y="36" class="trophy-title-lg" fill="#f0f6fc">PULL SHARK</text>
      <rect x="124" y="23" width="62" height="16" rx="8" fill="#f0a56b" fill-opacity="0.15" stroke="#f0a56b" stroke-width="0.8"/>
      <text x="155" y="34.2" class="trophy-badge" fill="#f0a56b">BRONZE x2</text>
      <text y="54" class="trophy-sub-text" fill="#8b949e">Opened pull requests that have been merged</text>
      <g transform="translate(0, 65)">
        <rect width="78" height="16" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
        <text x="39" y="11.2" class="trophy-badge" fill="#10b981">UNLOCKED ✓</text>
        <text x="86" y="11.5" class="trophy-sub-text" fill="#6e7681">Oct 2026 · Verified on GitHub</text>
      </g>
    </g>
  </g>

  <!-- YOLO -->
  <g transform="translate(0, 126)">
    <rect x="6" y="6" width="348" height="118" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(52, 65)">
      <circle r="33" fill="#c084fc" fill-opacity="0.1" stroke="#c084fc" stroke-width="1.5" filter="url(#neonGlow)"/>
      <circle r="26" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3"/>
      <g transform="rotate(-12)">
        <rect x="-12" y="-12" width="24" height="24" rx="5" stroke="#c084fc" stroke-width="2.2"/>
        <g fill="#c084fc">
          <circle cx="-5.5" cy="-5.5" r="2.1"/>
          <circle cx="5.5" cy="-5.5" r="2.1"/>
          <circle cx="0" cy="0" r="2.1"/>
          <circle cx="-5.5" cy="5.5" r="2.1"/>
          <circle cx="5.5" cy="5.5" r="2.1"/>
        </g>
      </g>
    </g>
    <g transform="translate(98, 21)">
      <rect width="124" height="16" rx="8" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="0.8"/>
      <text x="62" y="11.2" class="trophy-badge" fill="#c084fc">OFFICIAL ACHIEVEMENT</text>
      <text y="36" class="trophy-title-lg" fill="#f0f6fc">YOLO</text>
      <text y="54" class="trophy-sub-text" fill="#8b949e">Merged a pull request without a review</text>
      <g transform="translate(0, 65)">
        <rect width="78" height="16" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
        <text x="39" y="11.2" class="trophy-badge" fill="#10b981">UNLOCKED ✓</text>
        <text x="86" y="11.5" class="trophy-sub-text" fill="#6e7681">Oct 2026 · Verified on GitHub</text>
      </g>
    </g>
  </g>

  <!-- Quickdraw -->
  <g transform="translate(0, 252)">
    <rect x="6" y="6" width="348" height="118" rx="12" fill="url(#cardGrad)" stroke="#ffe259" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(52, 65)">
      <circle r="33" fill="#ffe259" fill-opacity="0.1" stroke="#ffe259" stroke-width="1.5" filter="url(#neonGlow)"/>
      <circle r="26" stroke="#ffe259" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3"/>
      <path d="M-3,-14 L7,-3 L1,0 L8,14 L-6,3 L-1,0 Z" fill="url(#goldGrad)" filter="url(#neonGlow)"/>
    </g>
    <g transform="translate(98, 21)">
      <rect width="124" height="16" rx="8" fill="#ffe259" fill-opacity="0.15" stroke="#ffe259" stroke-width="0.8"/>
      <text x="62" y="11.2" class="trophy-badge" fill="#ffe259">OFFICIAL ACHIEVEMENT</text>
      <text y="36" class="trophy-title-lg" fill="#f0f6fc">QUICKDRAW</text>
      <text y="54" class="trophy-sub-text" fill="#8b949e">Closed an issue or pull request in 5 minutes</text>
      <g transform="translate(0, 65)">
        <rect width="78" height="16" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
        <text x="39" y="11.2" class="trophy-badge" fill="#10b981">UNLOCKED ✓</text>
        <text x="86" y="11.5" class="trophy-sub-text" fill="#6e7681">Oct 2026 · Verified on GitHub</text>
      </g>
    </g>
  </g>
</svg>
