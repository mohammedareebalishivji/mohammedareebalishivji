<svg
  width="840"
  height="150"
  viewBox="0 0 840 150"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="trophyShowroomTitle"
>
  <title id="trophyShowroomTitle">Mohammed Areeb Ali Shivji's Hall of Trophies &amp; Achievements</title>
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .trophy-card {
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .trophy-title {
      font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #f0f6fc;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .trophy-sub {
      font: 500 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #8b949e;
      text-anchor: middle;
    }
    .trophy-badge {
      font: 700 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Card 1: Quickdraw -->
  <g class="trophy-card" transform="translate(10, 10)">
    <rect width="126" height="130" rx="10" fill="url(#cardGrad)" stroke="#ffe259" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(63, 38)">
      <circle r="22" fill="#ffe259" fill-opacity="0.12" stroke="#ffe259" stroke-width="1" filter="url(#neonGlow)"/>
      <path d="M-2,-12 L6,-2 L1,0 L7,12 L-4,2 L0,0 Z" fill="url(#goldGrad)"/>
    </g>
    <text x="63" y="80" class="trophy-title">QUICKDRAW</text>
    <text x="63" y="96" class="trophy-sub">Sub-5m Dispatch</text>
    <rect x="24" y="104" width="78" height="16" rx="8" fill="#ffe259" fill-opacity="0.15" stroke="#ffe259" stroke-width="0.8"/>
    <text x="63" y="115" class="trophy-badge" fill="#ffe259">UNLOCKED 1x</text>
  </g>

  <!-- Card 2: YOLO -->
  <g class="trophy-card" transform="translate(148, 10)">
    <rect width="126" height="130" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(63, 38)">
      <circle r="22" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="1" filter="url(#neonGlow)"/>
      <path d="M0,-12 C4,-6 8,0 6,8 C4,12 -4,12 -6,8 C-8,0 -4,-6 0,-12 Z" fill="url(#rubyGrad)"/>
      <circle cx="0" cy="2" r="3" fill="#ffe4e6"/>
    </g>
    <text x="63" y="80" class="trophy-title">YOLO</text>
    <text x="63" y="96" class="trophy-sub">Merged w/o Review</text>
    <rect x="24" y="104" width="78" height="16" rx="8" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="63" y="115" class="trophy-badge" fill="#f43f5e">UNLOCKED 1x</text>
  </g>

  <!-- Card 3: Pull Shark -->
  <g class="trophy-card" transform="translate(286, 10)">
    <rect width="126" height="130" rx="10" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(63, 38)">
      <circle r="22" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1" filter="url(#neonGlow)"/>
      <path d="M-8,-6 C-4,-14 4,-14 8,-6 C12,0 8,8 0,12 C-8,8 -12,0 -8,-6 Z" fill="url(#cyanNeon)"/>
      <polygon points="-3,-1 0,-8 3,-1 7,2 -7,2" fill="#ffffff" opacity="0.9"/>
      <circle cx="0" cy="5" r="2" fill="#0d1117"/>
    </g>
    <text x="63" y="80" class="trophy-title">PULL SHARK</text>
    <text x="63" y="96" class="trophy-sub">PR Integrator</text>
    <rect x="24" y="104" width="78" height="16" rx="8" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="0.8"/>
    <text x="63" y="115" class="trophy-badge" fill="#00f2fe">BRONZE x2</text>
  </g>

  <!-- Card 4: Pair Extraordinaire -->
  <g class="trophy-card" transform="translate(424, 10)">
    <rect width="126" height="130" rx="10" fill="url(#cardGrad)" stroke="#d946ef" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(63, 38)">
      <circle r="22" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-width="1" filter="url(#neonGlow)"/>
      <circle cx="-5" cy="-4" r="5" fill="url(#purpleGrad)"/>
      <path d="M-11,8 C-11,4 -7,3 -5,3 C-3,3 1,4 1,8 Z" fill="url(#purpleGrad)"/>
      <circle cx="6" cy="-4" r="5" fill="#f0abfc"/>
      <path d="M0,8 C0,4 4,3 6,3 C8,3 12,4 12,8 Z" fill="#f0abfc"/>
    </g>
    <text x="63" y="80" class="trophy-title">PAIR EXTRA</text>
    <text x="63" y="96" class="trophy-sub">Co-Authored Delivery</text>
    <rect x="24" y="104" width="78" height="16" rx="8" fill="#d946ef" fill-opacity="0.15" stroke="#d946ef" stroke-width="0.8"/>
    <text x="63" y="115" class="trophy-badge" fill="#d946ef">BRONZE x1</text>
  </g>

  <!-- Card 5: Galaxy Brain -->
  <g class="trophy-card" transform="translate(562, 10)">
    <rect width="126" height="130" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(63, 38)">
      <circle r="22" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-width="1" filter="url(#neonGlow)"/>
      <path d="M-8,-4 C-10,-9 -4,-12 0,-8 C4,-12 10,-9 8,-4 C10,-1 9,6 6,8 C4,9 2,10 0,10 C-2,10 -4,9 -6,8 C-9,6 -10,-1 -8,-4 Z" fill="url(#indigoGrad)" opacity="0.9"/>
      <circle cx="-3" cy="-1" r="1.5" fill="#ffffff"/>
      <circle cx="3" cy="-1" r="1.5" fill="#ffffff"/>
      <circle cx="0" cy="5" r="1.5" fill="#ffffff"/>
    </g>
    <text x="63" y="80" class="trophy-title">GALAXY BRAIN</text>
    <text x="63" y="96" class="trophy-sub">Accepted Answers</text>
    <rect x="24" y="104" width="78" height="16" rx="8" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="0.8"/>
    <text x="63" y="115" class="trophy-badge" fill="#818cf8">BRONZE x2</text>
  </g>

  <!-- Card 6: Starstruck -->
  <g class="trophy-card" transform="translate(700, 10)">
    <rect width="126" height="130" rx="10" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.4"/>
    <g transform="translate(63, 38)">
      <circle r="22" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1" filter="url(#neonGlow)"/>
      <polygon points="0,-10 3,-3 10,-3 4.5,1.5 6.5,8 0,4.2 -6.5,8 -4.5,1.5 -10,-3 -3,-3" fill="url(#amberGrad)"/>
    </g>
    <text x="63" y="80" class="trophy-title">STARSTRUCK</text>
    <text x="63" y="96" class="trophy-sub">Repo Stars Gained</text>
    <rect x="24" y="104" width="78" height="16" rx="8" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="63" y="115" class="trophy-badge" fill="#fbbf24">BRONZE 16★</text>
  </g>
</svg>
