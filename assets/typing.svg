<svg
  width="300"
  height="122"
  viewBox="0 0 300 122"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  role="img"
  aria-label="Mohammed Areeb Ali Shivji - Animated Terminal"
>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .term-title { font-size: 9.5px; font-weight: 600; fill: #8b949e; }
    .prompt-lbl { font-size: 12px; font-weight: 700; fill: #00f2fe; }
    .typed-text { font-size: 11px; font-weight: 600; }
    .footer-ticker { font-size: 8.5px; font-weight: 600; fill: #6e7681; }
  </style>

  <!-- Card and title bar -->
  <rect x="1.5" y="1.5" width="297" height="119" rx="10" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="2" y="29" width="296" height="1" fill="#1e293b" />
  <circle cx="15" cy="15" r="4" fill="#ff5f56" />
  <circle cx="28" cy="15" r="4" fill="#ffbd2e" />
  <circle cx="41" cy="15" r="4" fill="#27c93f" />
  <text x="150" y="18.5" text-anchor="middle" class="term-title">mohammedareeb@eve-core: ~</text>
  <circle cx="252" cy="15" r="3" fill="#22c55e" />
  <text x="259" y="18.5" class="term-title">ONLINE</text>

  <text x="14" y="51" class="prompt-lbl">❯ eve-agent --role</text>

  <!-- Rotating typed lines -->
  <path id="line0">
    <animate id="a0" attributeName="d" begin="0s;a4.end" dur="3800ms" fill="remove"
      values="m14,73 h0 ; m14,73 h272 ; m14,73 h272 ; m14,73 h0" keyTimes="0;0.5;0.88;1" />
  </path>
  <text class="typed-text" fill="#00f2fe">
    <textPath xlink:href="#line0">⚡ Autonomous Multi-Agent AI Systems</textPath>
  </text>

  <path id="line1">
    <animate id="a1" attributeName="d" begin="a0.end" dur="3800ms" fill="remove"
      values="m14,73 h0 ; m14,73 h272 ; m14,73 h272 ; m14,73 h0" keyTimes="0;0.5;0.88;1" />
  </path>
  <text class="typed-text" fill="#38bdf8">
    <textPath xlink:href="#line1">🚀 Creator of EVE</textPath>
  </text>

  <path id="line2">
    <animate id="a2" attributeName="d" begin="a1.end" dur="3800ms" fill="remove"
      values="m14,73 h0 ; m14,73 h272 ; m14,73 h272 ; m14,73 h0" keyTimes="0;0.5;0.88;1" />
  </path>
  <text class="typed-text" fill="#a855f7">
    <textPath xlink:href="#line2">🧠 Claude • Gemini • Local SLMs • RAG</textPath>
  </text>

  <path id="line3">
    <animate id="a3" attributeName="d" begin="a2.end" dur="3800ms" fill="remove"
      values="m14,73 h0 ; m14,73 h272 ; m14,73 h272 ; m14,73 h0" keyTimes="0;0.5;0.88;1" />
  </path>
  <text class="typed-text" fill="#06b6d4">
    <textPath xlink:href="#line3">🛠️ Next.js 16 • TypeScript • Python</textPath>
  </text>

  <path id="line4">
    <animate id="a4" attributeName="d" begin="a3.end" dur="3800ms" fill="remove"
      values="m14,73 h0 ; m14,73 h272 ; m14,73 h272 ; m14,73 h0" keyTimes="0;0.5;0.88;1" />
  </path>
  <text class="typed-text" fill="#4facfe">
    <textPath xlink:href="#line4">🌐 Computer-Use, Vision &amp; Navigation</textPath>
  </text>

  <!-- Typing cursor -->
  <rect x="16" y="63" width="6" height="13" rx="1" fill="#00f2fe">
    <animate id="cur0" attributeName="x" begin="0s;cur4.end" dur="3800ms" fill="remove"
      values="16 ; 254 ; 254 ; 16" keyTimes="0;0.4375;0.88;1" />
    <animate id="cur1" attributeName="x" begin="cur0.end" dur="3800ms" fill="remove"
      values="16 ; 135 ; 135 ; 16" keyTimes="0;0.2188;0.88;1" />
    <animate id="cur2" attributeName="x" begin="cur1.end" dur="3800ms" fill="remove"
      values="16 ; 260 ; 260 ; 16" keyTimes="0;0.4485;0.88;1" />
    <animate id="cur3" attributeName="x" begin="cur2.end" dur="3800ms" fill="remove"
      values="16 ; 254 ; 254 ; 16" keyTimes="0;0.4375;0.88;1" />
    <animate id="cur4" attributeName="x" begin="cur3.end" dur="3800ms" fill="remove"
      values="16 ; 260 ; 260 ; 16" keyTimes="0;0.4485;0.88;1" />
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="0.75s" repeatCount="indefinite" />
  </rect>

  <!-- Status line -->
  <rect x="2" y="92" width="296" height="1" fill="#1e293b" />
  <text x="14" y="110" class="footer-ticker"><tspan fill="#00f2fe">●</tspan> CORE: EVE  <tspan fill="#a855f7">●</tspan> RAG: VECTOR  <tspan fill="#22c55e">●</tspan> STATUS: NOMINAL</text>
</svg>
